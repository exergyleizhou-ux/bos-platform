# BOS Pipeline v9.0 OpenTelemetry Collector configuration
# Used by docker-compose.otel.yml

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://localhost:*"
            - "https://bos-pipeline.com"

processors:
  # Batch processor
  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048

  # Memory limiter
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64

  # Attribute enrichment
  attributes:
    actions:
      - key: deployment.environment
        action: upsert
        value: development
      - key: service.namespace
        action: upsert
        value: bos-pipeline

  # Resource attributes
  resource:
    attributes:
      - key: host.name
        from_attribute: ""
        action: upsert
      - key: service.version
        value: "9.0.0"
        action: upsert

  # Filter out routine health-check spans
  filter/health:
    error_mode: ignore
    traces:
      span:
        - 'attributes["http.route"] == "/api/health/live"'
        - 'attributes["http.route"] == "/api/health/ready"'
        - 'attributes["http.target"] == "/favicon.ico"'

exporters:
  # Jaeger traces
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Console debug logging
  logging:
    verbosity: detailed
    sampling_initial: 5
    sampling_thereafter: 200

  # Prometheus metrics
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: bos_pipeline
    const_labels:
      environment: development

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, zpages]

  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/health, batch, attributes, resource]
      exporters: [otlp/jaeger, logging]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]

  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888
