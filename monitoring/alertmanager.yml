# BOS Pipeline v9.0 Alertmanager configuration

global:
  resolve_timeout: 5m

  # SMTP for email alerts
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: "alerts@bos-pipeline.com"
  smtp_auth_username: "alerts@bos-pipeline.com"
  smtp_auth_password: "change-me-in-production"
  smtp_require_tls: true

route:
  group_by: ["alertname", "service", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default-email"

  routes:
    - match:
        severity: critical
      receiver: "critical-alerts"
      group_wait: 10s
      repeat_interval: 1h

    - match:
        severity: warning
      receiver: "warning-alerts"
      group_wait: 1m
      repeat_interval: 4h

    - match:
        severity: info
      receiver: "default-email"
      group_wait: 5m
      repeat_interval: 24h

receivers:
  - name: "default-email"
    email_configs:
      - to: "devops@bos-pipeline.com"
        send_resolved: true
        headers:
          Subject: "[BOS] {{ .Status | toUpper }} - {{ .CommonLabels.alertname }}"

  - name: "critical-alerts"
    email_configs:
      - to: "oncall@bos-pipeline.com"
        send_resolved: true
        headers:
          Subject: "[BOS CRITICAL] {{ .CommonLabels.alertname }} - {{ .CommonLabels.service }}"

  - name: "warning-alerts"
    email_configs:
      - to: "devops@bos-pipeline.com"
        send_resolved: true
        headers:
          Subject: "[BOS WARNING] {{ .CommonLabels.alertname }}"

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname", "service"]

  - source_match:
      severity: critical
    target_match:
      severity: info
    equal: ["service"]

templates:
  - "/etc/alertmanager/templates/*.tmpl"
