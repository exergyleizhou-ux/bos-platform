# BOS Pipeline v9.0 �� Prometheus Configuration
# �T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: bos-pipeline
    environment: development

# ���� Alerting Configuration ����
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# ���� Recording & Alerting Rules ����
rule_files:
  - /etc/prometheus/rules/*.yml

# ���� Scrape Targets ����
scrape_configs:
  # ���� Prometheus self-monitoring ����
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus

  # ���� FastAPI Backend ����
  - job_name: "bos-backend"
    metrics_path: /api/metrics
    scrape_interval: 10s
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: backend
          component: api
    # Handle authentication for metrics endpoint
    # bearer_token_file: /etc/prometheus/token

  # ���� Celery Worker ����
  - job_name: "bos-celery-worker"
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["celery-worker:9808"]
        labels:
          service: celery
          component: worker

  # ���� PostgreSQL (via postgres_exporter) ����
  - job_name: "postgres"
    scrape_interval: 30s
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgresql
          component: database

  # ���� Redis (via redis_exporter) ����
  - job_name: "redis"
    scrape_interval: 15s
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: redis
          component: cache

  # ���� Nginx (via nginx_exporter or stub_status) ����
  - job_name: "nginx"
    scrape_interval: 15s
    static_configs:
      - targets: ["nginx-exporter:9113"]
        labels:
          service: nginx
          component: proxy

  # ���� Node Exporter (host metrics) ����
  - job_name: "node"
    scrape_interval: 30s
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: host
          component: system

  # ���� OpenTelemetry Collector (when OTel stack is enabled) ����
  - job_name: "otel-collector"
    scrape_interval: 15s
    static_configs:
      - targets: ["otel-collector:8888"]
        labels:
          service: otel-collector
          component: telemetry

  # ���� OTel Collector Prometheus Exporter (span metrics) ����
  - job_name: "otel-span-metrics"
    scrape_interval: 15s
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: otel-collector
          component: span-metrics

