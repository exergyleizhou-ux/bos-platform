# �T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T
# BOS Pipeline v9.0 �� CI Pipeline (GitHub Actions)
# �T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T
#
# Triggers:
#   - Push to main / develop
#   - Pull requests to main
#
# Jobs:
#   1. lint       : Code quality (ruff, mypy, eslint)
#   2. test-backend : Python tests with PostgreSQL + Redis
#   3. test-frontend : React/Vitest
#   4. build      : Docker image build
#   5. security   : Dependency audit + Trivy scan

name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # �T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T
  # Job 1: Lint
  # �T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python lint tools
        run: pip install ruff mypy black

      - name: Ruff (linter)
        run: ruff check backend/

      - name: Black (formatter check)
        run: black --check --line-length 120 backend/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

  docs-consistency:
    name: Docs Consistency
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify generated benchmark docs
        run: python scripts/bos_code_benchmark.py verify-docs

  # �T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T
  # Job 2: Frontend Compile Gate
  # 锟絋锟絋锟絋锟絋锟絋锟絋锟絋锟絋锟絋锟絋锟絋锟絋锟絋锟絋锟絋锟絋锟絋锟絋锟絋锟絋锟絋锟絋锟絋锟絋锟絋锟絋锟絋锟絋锟絋锟絋锟絋锟絋锟絋锟絋锟絋锟絋锟絋锟絋锟絋锟絋
  frontend-compile:
    name: Frontend Compile Gate
    runs-on: ubuntu-latest
    needs: [lint, docs-consistency]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run BOS mechanistic frontend slice
        working-directory: frontend
        run: |
          npm exec vitest run \
            src/api/bosApi.test.ts \
            src/lib/bos-read-model.test.ts \
            src/components/bos/MechanisticContextCard.test.tsx \
            src/components/bos/SignalSupervisorPanel.test.tsx

      - name: Run frontend compile contract
        working-directory: frontend
        run: |
          npm run type-check
          npm run build

  benchmark-suite-catalog:
    name: Benchmark Suite Catalog
    runs-on: ubuntu-latest
    needs: [lint, docs-consistency]
    outputs:
      suites: ${{ steps.catalog.outputs.suites }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Export CI benchmark suites
        id: catalog
        run: |
          suites_json=$(python scripts/bos_code_benchmark.py list-suites --json --ci-only)
          echo "suites=$suites_json" >> "$GITHUB_OUTPUT"

  benchmark-suite:
    name: Benchmark Suite (${{ matrix.suite }})
    runs-on: ubuntu-latest
    needs: [frontend-compile, benchmark-suite-catalog]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.benchmark-suite-catalog.outputs.suites) }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: bos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d bos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Alembic migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/bos_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key-for-ci-only-32chars!!
          JWT_REFRESH_SECRET_KEY: test-refresh-key-for-ci-only-32!!
          ENVIRONMENT: testing
        run: alembic upgrade head

      - name: Run BOS benchmark suite
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/bos_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key-for-ci-only-32chars!!
          JWT_REFRESH_SECRET_KEY: test-refresh-key-for-ci-only-32!!
          ENVIRONMENT: testing
        run: python scripts/bos_code_benchmark.py run --suite ${{ matrix.suite }}

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bos-benchmark-runs-${{ matrix.suite }}
          path: reports/benchmark-runs
          if-no-files-found: warn

  # Job 3: Backend Tests
  # �T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [frontend-compile, benchmark-suite]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: bos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d bos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('backend/requirements.txt') }}

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run Alembic migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/bos_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key-for-ci-only-32chars!!
          JWT_REFRESH_SECRET_KEY: test-refresh-key-for-ci-only-32!!
          ENVIRONMENT: testing
        run: alembic upgrade head

      - name: Run BOS mechanistic backend slice
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/bos_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key-for-ci-only-32chars!!
          JWT_REFRESH_SECRET_KEY: test-refresh-key-for-ci-only-32!!
          ENVIRONMENT: testing
        run: |
          pytest \
            tests/unit/test_bos_mechanistic_engine.py \
            tests/unit/test_bos_supervisor_engine.py \
            tests/unit/test_bos_report_service.py \
            tests/integration/test_bos_router_live.py \
            -q

      - name: Run tests with coverage
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/bos_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key-for-ci-only-32chars!!
          JWT_REFRESH_SECRET_KEY: test-refresh-key-for-ci-only-32!!
          ENVIRONMENT: testing
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --junitxml=results.xml \
            -v \
            --tb=short

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}

  # �T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T
  # Job 4: Frontend Tests
  # �T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: [frontend-compile, benchmark-suite]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm run test

  # �T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T
  # Job 5: Docker Build
  # �T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T
  release-packet-ingest:
    name: Release Packet Ingest
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate release dossier and manifest
        run: python scripts/validate_release_report.py

      - name: Ingest go-live packet
        run: python scripts/ingest_go_live_packet.py

      - name: Upload go-live ingest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bos-release-go-live-ingest
          path: reports/stabilize-v9/go-live-packet-ingest.json
          if-no-files-found: error

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, release-packet-ingest]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/bos-backend:${{ github.sha }}
            ${{ secrets.DOCKER_REGISTRY }}/bos-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/bos-frontend:${{ github.sha }}
            ${{ secrets.DOCKER_REGISTRY }}/bos-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # �T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T
  # Job 6: Security Scan
  # �T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: pip audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2024-0001 || true

      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high || true

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
