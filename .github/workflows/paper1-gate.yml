# Paper 1 gate workflow — Phase B causal layer + paper-pin audit
#
# Independent of the main ci.yml so that Phase B / Paper 1 work on
# branch chat/bos-v9-stabilize-files gets coverage without
# disturbing the existing CI's main/develop trigger configuration.
#
# What this gate does:
#   1. Lints the Phase B engine code (light ruff, not a full repo sweep)
#   2. Runs the 53-test Phase B contract / unit / e2e suite
#   3. Runs the 51-test LangGraph agent suite
#   4. Confirms the paper-pin gate SKIPs gracefully on CI (the .docx
#      is not in the repo and the test path resolves to a Windows
#      author-machine absolute path — SKIP is the documented behaviour
#      in PAPER_PINNING.md §2)
#
# What this gate does NOT do:
#   - Frontend tests (covered by ci.yml's test-frontend job)
#   - Coverage upload (covered by ci.yml's test-backend job)
#   - Database / Redis integration (Phase B is in-process, no
#     external services required)
#   - Docker build / Trivy scan (covered by ci.yml)
#
# Triggers: any push to the Phase B working branch or main, plus PRs
# targeting either.

name: Paper 1 Gate (Phase B causal layer)

on:
  push:
    branches:
      - main
      - chat/bos-v9-stabilize-files
  pull_request:
    branches:
      - main
      - chat/bos-v9-stabilize-files

env:
  PYTHON_VERSION: "3.12"

jobs:
  paper1-gate-backend:
    name: Phase B 53-test gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Phase B unit + contract + E2E tests (53 tests)
        working-directory: backend
        run: |
          python -m pytest \
            tests/contract/test_paper_version_pinned.py \
            tests/contract/test_phase_b_openapi.py \
            tests/unit/test_causal_identify_engine.py \
            tests/unit/test_causal_estimate_engine.py \
            tests/unit/test_causal_refute_engine.py \
            tests/unit/test_causal_mediation_engine.py \
            tests/unit/test_causal_sensitivity_engine.py \
            tests/e2e/test_phase_b_e2e.py \
            -v --tb=short

      - name: Confirm paper-pin gate behaviour on CI
        working-directory: backend
        # The paper-pin gate SKIPs when the .docx path does not resolve
        # (CI runners have no access to the author's Windows machine).
        # SKIP is documented in PAPER_PINNING.md §2 as the expected CI
        # behaviour. A FAIL here would indicate either:
        #   (a) the test logic regressed and is no longer SKIP-safe; or
        #   (b) the .docx path was somehow vendored into the repo (it
        #       should never be — see .gitignore for *.docx.bak).
        run: |
          set -e
          out=$(python -m pytest tests/contract/test_paper_version_pinned.py -v 2>&1)
          echo "$out"
          if echo "$out" | grep -q 'SKIPPED\|passed'; then
            echo "OK: paper-pin gate produced SKIPPED or passed on CI as expected."
          else
            echo "FAIL: paper-pin gate did neither SKIP nor pass on CI."
            exit 1
          fi

  paper1-gate-agent:
    name: LangGraph agent 51-test gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies (for agent tests)
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Phase B B4 agent tests
        working-directory: backend
        run: |
          python -m pytest agent/tests/ -v --tb=short
