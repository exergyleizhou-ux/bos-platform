# BOS Pipeline v9.0 pytest configuration

[pytest]
testpaths = tests
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Unit tests (no DB/network)
    integration: Integration tests (requires DB)
    e2e: End-to-end tests (full workflow)
    slow: Tests that take more than 5 seconds

# Default options
# Note: -x (exit on first failure) removed 2026-05-17 per B0.5 §6 finding.
# Historic stdout-truncation observed during B0.3 reconciliation (24 visible
# vs 36 actual fails) traced to this flag. Default should show ALL failures
# for a complete audit signal. Override with `--exitfirst` on the CLI when
# iterating on a single test.
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
