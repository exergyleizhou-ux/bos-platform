# BOS Pipeline v9.0 �� Frontend Production Nginx
# �T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T
# Used inside the frontend production Docker image (Stage 3).
# This serves the pre-built Vue SPA and proxies API calls.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ���� Security Headers ����
    add_header X-Frame-Options          "SAMEORIGIN"       always;
    add_header X-Content-Type-Options   "nosniff"          always;
    add_header X-XSS-Protection         "1; mode=block"    always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;

    # ���� Gzip ����
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ���� SPA: all routes �� index.html ����
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ���� Static assets: aggressive caching ����
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ���� JS / CSS hashed files ����
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ���� Fonts ����
    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
    }

    # ���� Images ����
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ���� Do not serve hidden files ����
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ���� Health check for container orchestration ����
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ���� Custom error pages ����
    error_page 404 /index.html;

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

