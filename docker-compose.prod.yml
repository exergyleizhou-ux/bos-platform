# BOS Pipeline v9.0 �� Docker Compose (Production)
# �T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T�T
#
# Production overrides:
#   - No source volume mounts
#   - No --reload
#   - Multiple workers
#   - Resource limits
#   - Proper secrets management
#   - No debug endpoints

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bos_net

  redis:
    image: redis:7.2-alpine
    restart: always
    command: >
      redis-server
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --save 300 100
        --appendonly yes
        --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bos_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${DOCKER_REGISTRY:-local}/bos-backend:${APP_VERSION:-9.0.0}
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_REFRESH_SECRET_KEY: ${JWT_REFRESH_SECRET_KEY}
      ENVIRONMENT: production
      DEBUG: "false"
      APP_VERSION: ${APP_VERSION:-9.0.0}
      LOG_LEVEL: WARNING
      CORS_ORIGINS: ${CORS_ORIGINS}
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
    command: >
      uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
        --workers 4
        --loop uvloop
        --http httptools
        --log-level warning
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 15s
      timeout: 10s
      start_period: 40s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bos_net

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    image: ${DOCKER_REGISTRY:-local}/bos-celery:${APP_VERSION:-9.0.0}
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ENVIRONMENT: production
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    command: >
      celery -A app.celery_app:celery_app worker
        --loglevel=warning
        --concurrency=4
        --queues=default,compute,export,webhook,maintenance
        --max-tasks-per-child=200
        -n worker@%h
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bos_net

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    image: ${DOCKER_REGISTRY:-local}/bos-celery:${APP_VERSION:-9.0.0}
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ENVIRONMENT: production
    command: >
      celery -A app.celery_app:celery_app beat
        --loglevel=warning
        --schedule=/tmp/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - bos_net

  frontend-build:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-/api/v1/ws}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_APP_VERSION: ${APP_VERSION:-9.0.0}
    image: ${DOCKER_REGISTRY:-local}/bos-frontend-builder:${APP_VERSION:-9.0.0}
    restart: "no"
    command: sh -c "rm -rf /output/* && cp -r /app/dist/* /output/"
    volumes:
      - static_files:/output
    networks:
      - bos_net

  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/usr/share/nginx/html:ro
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    depends_on:
      backend:
        condition: service_started
      frontend-build:
        condition: service_completed_successfully
    networks:
      - bos_net

volumes:
  postgres_data:
  redis_data:
  static_files:

networks:
  bos_net:
    driver: bridge
